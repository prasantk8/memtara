[package]
name = "memtara-vault"
version = "0.1.0"
edition = "2021"
description = "Local-first encrypted vault for Memtara ZKP system"

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"

[dev-dependencies]
tokio-test = "0.4"