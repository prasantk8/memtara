openapi: 3.1.0

info:
  title: Memtara API
  version: 0.1.0
  summary: Zero-knowledge attribute disclosure, and the signed attestations that carry its verdicts off-platform.
  description: |
    Memtara lets a consumer prove a *predicate* about themselves — income above a
    threshold, residency valid, no sanctions match — without disclosing the
    attribute behind it. Proofs are generated on the holder's device against one
    of four Noir circuits; this API authenticates users, syncs the encrypted
    vault, orchestrates the disclosure-request lifecycle, verifies submitted
    proofs against the real compiled circuits via Barretenberg, and issues
    short-lived Ed25519-signed attestations that any JOSE-speaking relying party
    can validate offline.

    **This API never generates proofs.** Generating one requires the plaintext
    attribute as a witness, so a server that could prove would be a server that
    holds plaintext. See `ARCHITECTURE.md`. Every "verified" verdict here comes
    from running the real circuit's verifier over bytes a client produced.

    **Compliance context.** `docs/REGULATORY_MATRIX.md` maps this system, clause
    by clause, against the CBUAE *Guidance Note on Consumer Protection and the
    Responsible Adoption and Use of AI and ML by LFIs* (`CBUAE_EN_6958_VER1`).
    Predicate responses carry the clause ids each disclosure is evidence for.
  license:
    name: See repository
  contact:
    name: Memtara
    url: https://github.com/prasantk8

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.memtara.ai
    description: Production (illustrative — set MEMTARA_ISSUER_BASE_URL to match)

tags:
  - name: Identity
    description: The issuer's public signing key. Unauthenticated by design.
  - name: Proof issuance
    description: Turning a verified ZK proof into a signed, offline-verifiable attestation.
  - name: Structured-product suitability
    description: |
      DFSA Conduct of Business suitability, evidenced by a proof rather than a
      filing cabinet. Separate from Proof issuance because this circuit answers
      a question rather than asserting one — its verdict is a public output
      that must be read, and its thresholds must be checked against terms the
      firm registered in advance.
  - name: Disclosure
    description: The org-initiated "please prove X to me" lifecycle.
  - name: Consent
    description: |
      A revocable grant, recorded as a first-class fact — not the purpose
      `SessionPolicy.purpose_hash` binds a session to, which has never said
      anyone agreed to anything or that agreement was later withdrawn. Every
      route here is org-authenticated: `granted_via` (`assisted_kiosk`,
      `mobile_app`) says the grant was captured THROUGH an organisation's
      channel, so the row is the organisation's assertion that a grant of
      this shape happened, the same way `decision_reviews.reviewer_id` is.
      See `backend/api/src/consents/mod.rs`.
  - name: Audit trail
    description: |
      The hash-chained log, the signed checkpoints taken over its head, and
      the external witness that closes the "we can still delete our own
      history" gap a checkpoint alone leaves open. See
      `backend/api/src/audit/checkpoint.rs` and `audit/anchor.rs`.
  - name: Verification
    description: Checking a submitted proof against a circuit's verification key.
  - name: Auth
    description: Passkey, OTP and UAE Pass login.
  - name: Vault
    description: Encrypted blob sync. The server never holds the decryption key.
  - name: Organizations
    description: Relying-party accounts and their audit trail.
  - name: Product registry
    description: |
      A bank's catalogue of structured products and the suitability terms each
      is sold against. Exists so that the person making a recommendation is not
      the person who chooses the bar it is measured against — see the header of
      `backend/api/src/products/mod.rs`.
  - name: Operations
    description: |
      Health and metrics, for operators rather than banks. Unauthenticated, and
      deliberately carrying no tenant-identifying label.

security:
  - sessionToken: []

paths:

  /.well-known/jwks.json:
    get:
      tags: [Identity]
      summary: This deployment's public signing key, as a JWK Set
      description: |
        RFC 8037 OKP/Ed25519 key in RFC 7517 JWK Set form. A relying party
        fetches this once, caches it by `kid`, and validates every proof token
        locally — there is no synchronous call back to Memtara at validation
        time, which is what makes the integration zero-latency.

        Deliberately unauthenticated: a public key is public, and requiring a
        credential to fetch it would defeat offline validation.
      security: []
      responses:
        "200":
          description: The JWK Set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                    use: sig
                    alg: EdDSA
                    kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k

  /api/v1/predicates:
    get:
      tags: [Proof issuance]
      summary: The closed set of predicates this deployment will attest to
      description: |
        A published contract. `POST /api/v1/issue-proof` rejects any predicate
        not in this list, so a typo fails at the boundary rather than producing
        a valid-looking token asserting something nobody defined.
      security: []
      responses:
        "200":
          description: The predicate catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredicateCatalogueEntry"
              example:
                - predicate: income_gte_threshold
                  circuit: tax_session
                  cbuae_clauses: ["5(c)", "5(d)", "4(a)"]
                  dfsa_rules: []
                  endpoint: /api/v1/issue-proof
                  description: Income meets or exceeds the requested threshold; the income itself is not disclosed.
                - predicate: structured_product_suitable
                  circuit: wealth_suitability
                  cbuae_clauses: ["5(c)", "5(d)", "4(a)"]
                  dfsa_rules: ["COB 3.1"]
                  endpoint: /api/v1/submit-wealth-proof
                  description: Income, liquidity, risk tolerance and concentration assessed against a product's registered terms. One bit out.

  /api/v1/issue-proof:
    post:
      tags: [Proof issuance]
      summary: Issue a signed attestation that a predicate was proven
      description: |
        Two request shapes, both real circuit evaluations:

        * **Fresh** — supply `disclosure_request_id`, `public_inputs` and
          `proof`. The proof is checked against the circuit's verification key
          via `bb verify` right now, the request's nonce is consumed, and a
          token is issued only on a genuine cryptographic pass.
        * **Attested** — omit `public_inputs` and `proof`. The most recent proof
          that already passed verification for this `(user, circuit)` pair is
          re-attested. This exists because a proof is single-use by design (its
          nonce is burned), while a bank may legitimately need a second token
          for the same verified fact inside one onboarding session.

        Both paths write a `proof_token_issued` event, carrying the
        `regulatory_audit_id` and which path was taken, to the hash-chained
        audit log.

        **The issued token cannot be revoked inside its lifetime.** That is the
        deliberate cost of offline validation; see the §6(f) caveat in
        `docs/REGULATORY_MATRIX.md`. Revoke the disclosure request before
        issuance, or the user's session to prevent re-issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueProofRequest"
            examples:
              fresh:
                summary: Fresh evaluation against a pending disclosure request
                value:
                  user_id: 8f14e45f-ceea-467a-9f2a-1c1b2f3d4e5a
                  predicate: income_gte_threshold
                  disclosure_request_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  public_inputs: ["0x66c1e0a0", "0x66c1e6e0", "0x1a2b…", "0x0f4240", "0x1e8480", "0x…", "0x…", "0x…"]
                  proof: bXktcHJvb2YtYnl0ZXM
              attested:
                summary: Re-attest a proof this user already had verified
                value:
                  user_id: 8f14e45f-ceea-467a-9f2a-1c1b2f3d4e5a
                  predicate: residency_valid
      responses:
        "200":
          description: Attestation issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueProofResponse"
        "400":
          description: |
            Unknown predicate; `public_inputs`/`proof` supplied without each
            other; wrong public-input arity; nonce mismatch; the disclosure
            request is for a different circuit than the predicate requires; or
            the proof failed cryptographic verification (no token is minted, and
            the failure is itself recorded).
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: No such disclosure request.
          $ref: "#/components/responses/Error"
        "409":
          description: |
            The disclosure request is no longer pending; the nonce has already
            been consumed; or (attested path) no verified proof exists for this
            user and circuit.
          $ref: "#/components/responses/Error"

  /api/v1/issue-wealth-request:
    post:
      tags: [Structured-product suitability]
      summary: Open a suitability assessment and fix its terms (org)
      security:
        - orgApiKey: []
      description: |
        The firm's half of a DFSA suitability assessment. Registers the
        product's terms, mints a single-use nonce, and returns the 12-element
        public-input template the client's device must fill.

        **The ordering is the security argument.** The thresholds are public
        inputs to the circuit, and *every* value of them yields a valid proof —
        a client that could choose its own `min_income` could prove itself
        suitable for anything, with cryptography that verifies perfectly. Only
        the comparison in `POST /api/v1/submit-wealth-proof` against terms
        registered *here*, before the client was asked, makes the verdict mean
        anything.

        **The terms are no longer accepted here.** They are read from the
        product registry (`POST /api/v1/products`), which closes the other half
        of the same hole: whoever holds the org key could otherwise open an
        assessment with `min_income: 0` and receive a signed, cryptographically
        impeccable attestation that the client cleared a bar nobody set. A
        request that still supplies `min_income`, `min_liquidity`,
        `max_concentration_percent` or `product_risk_level` is **rejected**
        rather than having them ignored — an integration that sends them
        believes it is setting them, and that belief is worth surfacing once
        instead of leaving latent.

        The product must exist in *this org's* registry and must have
        `approved_by_risk_committee: true`. An assessment against an unapproved
        instrument produces evidence that a controlled process was followed when
        it was not, which is worse than producing no evidence at all.

        The terms are **snapshotted** onto the request. Amending the product
        afterwards does not reach back into assessments already open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueWealthRequest"
      responses:
        "201":
          description: Assessment opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueWealthRequestResponse"
        "400":
          description: |
            Malformed ISIN; suitability terms supplied in the body (they come
            from the registry); or a `ttl_seconds` outside 60-86400.
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: |
            No **unrevoked** consent grant on file for this user covers the
            purpose `wealth.suitability_recommendation`. The message names
            either the absence (no grant at all) or the most recent grant
            that covered it and when it was revoked. Grant one with
            `POST /api/v1/consents` first — see the Consent tag.
          $ref: "#/components/responses/Error"
        "404":
          description: |
            No such user, or the product is not in this organisation's
            registry. The message says which.
          $ref: "#/components/responses/Error"
        "409":
          description: The product has not been approved by the risk committee.
          $ref: "#/components/responses/Error"

  /api/v1/submit-wealth-proof:
    post:
      tags: [Structured-product suitability]
      summary: Answer a suitability assessment with a proof
      description: |
        The client's half. Authorised by either the org that opened the request
        or the user it is for.

        Checks, in order, before anything is signed:

        1. every submitted public input matches the terms the org registered;
        2. `current_time` falls inside the server's assessment window;
        3. `vault_root` equals the root this user actually synced via
           `PUT /vault` — without which the circuit's Merkle limb proves only
           that the figures are consistent with *some* tree, and a client can
           build one to order;
        4. `bb verify` against the `wealth_suitability` verification key, with
           the nonce consumed atomically on a pass;
        5. **public input 11 is read.**

        Step 5 is not optional. `bb verify` answers "was this proof correctly
        constructed", not "is the client suitable" — a proof that the client
        *failed* verifies exactly as cleanly as one that they passed. A token
        is issued either way, carrying the real verdict in `suitable`; a
        declined recommendation needs its evidence as much as an approved one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWealthProofRequest"
      responses:
        "200":
          description: |
            Assessment complete. Check `suitable` — a `200` means the proof
            verified, not that the client qualified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitWealthProofResponse"
        "400":
          description: |
            Public inputs disagree with the registered terms; `current_time`
            outside the window; `vault_root` is not this user's committed root;
            wrong arity; nonce mismatch; the proof failed verification; or the
            circuit output was neither 0 nor 1.
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: No such suitability request.
          $ref: "#/components/responses/Error"
        "409":
          description: |
            Already assessed; the nonce has been consumed; or the user has no
            synced vault to check the assessment against.
          $ref: "#/components/responses/Error"

  /disclosure-requests:
    post:
      tags: [Disclosure]
      summary: Create a disclosure request (org)
      security:
        - orgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisclosureRequest"
      responses:
        "201":
          description: |
            Created. The returned `nonce` is the exact value the client must
            embed as the circuit's `nonce` public input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosureRequest"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: No such user.
          $ref: "#/components/responses/Error"
    get:
      tags: [Disclosure]
      summary: List the authenticated user's own disclosure requests
      parameters:
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
          description: |
            Optional, and if given must equal the caller's own id — a different
            value is rejected rather than silently ignored.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DisclosureStatus"
      responses:
        "200":
          description: The caller's requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisclosureRequestSummary"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /disclosure-requests/{id}:
    get:
      tags: [Disclosure]
      summary: Fetch one disclosure request
      description: Readable by the org that created it or the user it is for.
      security:
        - sessionToken: []
        - orgApiKey: []
      parameters: [{ $ref: "#/components/parameters/DisclosureRequestId" }]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisclosureRequest" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /disclosure-requests/{id}/revoke:
    post:
      tags: [Disclosure]
      summary: Revoke a pending disclosure request
      description: |
        Takes effect immediately. This is the revocable primitive that CBUAE
        §6(f) ("clear and immediate ability, with human intervention, to cease
        use") is satisfied by — not the proof token, which is short-lived and
        non-revocable by design.
      security:
        - sessionToken: []
        - orgApiKey: []
      parameters: [{ $ref: "#/components/parameters/DisclosureRequestId" }]
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, example: revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Already fulfilled, expired or revoked.
          $ref: "#/components/responses/Error"

  /disclosure-requests/{id}/proofs:
    post:
      tags: [Verification]
      summary: Submit a proof against a disclosure request
      description: |
        Runs `bb verify` against the circuit's verification key. On a genuine
        pass the nonce is consumed atomically, the proof is recorded, and the
        request flips to `fulfilled`.

        A cryptographically invalid proof returns `201` with `valid: false`: it
        is recorded for the audit trail but does **not** consume the nonce or
        change the request's status, so a third party cannot burn the legitimate
        holder's one-shot grant.
      security:
        - sessionToken: []
        - orgApiKey: []
      parameters: [{ $ref: "#/components/parameters/DisclosureRequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitProofRequest" }
      responses:
        "201":
          description: Proof recorded. Check `valid` — this status does not mean the proof passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitProofResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Request not pending, or nonce already consumed.
          $ref: "#/components/responses/Error"

  /orgs:
    post:
      tags: [Organizations]
      summary: Register a relying party
      description: The API key is returned once, at creation, and only its hash is stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, org_type]
              properties:
                name: { type: string }
                org_type: { $ref: "#/components/schemas/OrgType" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  org_type: { $ref: "#/components/schemas/OrgType" }
                  api_key:
                    type: string
                    description: Shown once. Not recoverable.

  /orgs/{id}/disclosure-requests:
    get:
      tags: [Organizations]
      summary: An org's own disclosure requests
      security: [{ orgApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: The org's requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DisclosureRequestSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /orgs/{id}/audit-log:
    get:
      tags: [Organizations]
      summary: This org's slice of the hash-chained audit log
      description: |
        Rows whose `ref_id` names one of this org's disclosure requests. The
        chain itself is global (it commits to the true interleaving across all
        orgs, which is strictly stronger than per-org chains); this endpoint
        filters the view, not the chain.
      security: [{ orgApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: Audit entries in chain order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /orgs/{id}/audit-log/replay:
    get:
      tags: [Organizations, Audit trail]
      summary: Rebuild every binding event in this org's trail and report what it finds
      description: |
        The BINDING claim, org-wide: not "was any record removed or
        reordered" (linkage — the plain audit-log endpoint above, and the
        chain walk in the offline bundle), but "do the mutable rows a
        decision was judged on still say what the chain hashed when it was
        written". Only event types in `audit/binding.rs::BINDING_EVENT_TYPES`
        are in scope; everything else is reported by type and count under
        `summary.out_of_scope` rather than silently skipped, because a
        verifier that reports "0 problems" while quietly excluding most of
        its input is the failure mode this whole product argues against.

        `GET /api/v1/wealth-assessments/{request_id}/decision-evidence`
        calls the same underlying function scoped to one decision (plus its
        model corrections and the consent grant it cites); this is the
        org-wide view.
      security: [{ orgApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: The replay report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayReport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /audit/checkpoints/latest:
    get:
      tags: [Audit trail]
      summary: The most recently signed checkpoint over the chain head
      description: |
        Unauthenticated, like `/.well-known/jwks.json` and for the same
        reason: a checkpoint whose whole purpose is to be held by third
        parties is not published if it needs an API key to read. The cost is
        that total audit-event volume across all tenants (`head_seq`, a row
        count) becomes public; no tenant and no event type is named.

        `external_anchor` is always present, one of the three states in
        `AnchorState` — even "not yet anchored" (`pending`) is a reportable
        fact, not an absent field.
      security: []
      responses:
        "200":
          description: The checkpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointResponse" }
        "404":
          description: No checkpoint has ever been taken on this deployment.
          $ref: "#/components/responses/Error"

  /audit/checkpoints/covering/{seq}:
    get:
      tags: [Audit trail]
      summary: The earliest checkpoint that pins a given audit_log seq, if one exists
      description: |
        `200` with `covered: false` rather than `404` when nothing covers the
        row yet — "there is no checkpoint over this row" is a true and useful
        answer about a row that exists, and a customer asking this question
        is usually asking exactly that.
      security: []
      parameters:
        - name: seq
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Coverage state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoveringResponse" }
        "400":
          description: seq must be a positive integer.
          $ref: "#/components/responses/Error"

  /audit/checkpoints:
    post:
      tags: [Audit trail]
      summary: Pin the current chain head now
      description: |
        The moment a checkpoint is most valuable is immediately before an
        export or a dispute, not the background loop's own schedule.
        Idempotent: if the head has not moved since the last checkpoint, the
        existing one is returned (`emitted: false`) rather than a second
        signed statement about the same chain position — which is what makes
        this safe to expose to any authenticated org.
      security: [{ orgApiKey: [] }]
      responses:
        "200":
          description: |
            Either a fresh checkpoint (`emitted: true`) or the existing one
            unchanged (`emitted: false`, empty chain or head unmoved).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmitResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /audit/integrity:
    get:
      tags: [Audit trail]
      summary: Verify the newest checkpoint against the log as it stands, and report the exposure
      description: |
        `intact` is true only if a checkpoint exists AND it still verifies
        against the log — deliberately `false`, not absent, on a deployment
        that has never checkpointed. `uncovered_rows` is the residual
        exposure window expressed as a number: rows appended since the
        checkpoint, the newest of which can be edited undetectably until the
        next one. `anchor` carries the same three-state `AnchorState` as
        `CheckpointResponse.external_anchor`, `null` only when there is no
        checkpoint at all yet.
      security: [{ orgApiKey: [] }]
      responses:
        "200":
          description: Integrity verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrityResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /audit/anchors/sweep:
    post:
      tags: [Audit trail]
      summary: Run one external-witness anchoring pass now
      description: |
        `POST /audit/checkpoints`'s sibling for the anchoring half: the
        background sweep runs on `AnchorPolicy::sweep_interval` (300s by
        default); this runs one pass immediately. Any authenticated org may
        call it — nothing here is tenant-scoped, and every checkpoint
        anchored benefits every tenant, so gating "witness my evidence now"
        behind an admin role would make it something customers ask us to do
        rather than something they can do.

        Never blocks a request path on the TSA: a provider failure for one
        checkpoint is reported in `details` and retried on the next sweep (or
        the next call to this endpoint), and does not fail the call.
      security: [{ orgApiKey: [] }]
      responses:
        "200":
          description: Sweep outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SweepResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/consents:
    post:
      tags: [Consent]
      summary: Record a revocable consent grant (org)
      description: |
        Refuses an empty `scope`, a `purpose_hash` that is not a 64-hex-char
        SHA-256, and — mirroring `check_policy_is_bindable` — a float
        anywhere in the body, because a float has no canonical rendering
        Python and Rust agree on and this grant will be hashed into the
        chain. `granted_at` defaults to the server's clock; supplying an
        earlier one (migrating consent history from a legacy CRM or a paper
        file) is accepted, with no lower bound, only an upper one
        (`MAX_CLOCK_SKEW_SECONDS`, 300s) against claiming a grant that has
        not happened yet.
      security: [{ orgApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsentBody" }
            examples:
              kiosk:
                summary: Captured at a bank branch kiosk
                value:
                  user_id: 8f14e45f-ceea-467a-9f2a-1c1b2f3d4e5a
                  scope: ["wealth.suitability_recommendation"]
                  consent_version: consent-policy-2026.3
                  granted_via: assisted_kiosk
              non_ascii_scope:
                summary: A non-English purpose string — the target market, not an edge case
                value:
                  user_id: 8f14e45f-ceea-467a-9f2a-1c1b2f3d4e5a
                  scope: ["تقييم_الملاءمة_المالية"]
                  consent_version: consent-policy-2026.3
                  granted_via: mobile_app
      responses:
        "201":
          description: Grant recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentResponse" }
        "400":
          description: |
            Empty `scope`; a `scope` element that is blank, not a string, or
            a float; a `purpose_hash` that is not a 64-hex-char digest; empty
            `consent_version`/`granted_via`; or `granted_at` more than
            `MAX_CLOCK_SKEW_SECONDS` in the future.
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: No such user.
          $ref: "#/components/responses/Error"
    get:
      tags: [Consent]
      summary: One user's consent history for this org (org)
      description: |
        Every grant, revoked or not, newest first — not filtered to
        unrevoked-only, because "what has this customer ever agreed to and
        withdrawn" is the more common examiner question, and each row's
        `revoked_at`/`revocation_reason` already answers it.
      security: [{ orgApiKey: [] }]
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: This org's grants for the named user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/consents/{id}:
    get:
      tags: [Consent]
      summary: Fetch one consent grant (org)
      security: [{ orgApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ConsentId" }]
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: |
            No such grant for this organisation. Another tenant's grant is
            indistinguishable from one that does not exist.
          $ref: "#/components/responses/Error"

  /api/v1/consents/{id}/revoke:
    post:
      tags: [Consent]
      summary: Revoke a consent grant (org)
      description: |
        Sets `revoked_at` exactly once; revoking an already-revoked grant is
        a `409`, not a silent success — a second call carrying a second,
        possibly different reason must not be swallowed into the first.
        Decisions opened before this revocation stand: their evidence
        answers "was consent live when this was decided", and that answer
        does not move. The *next* decision under the same purpose is
        refused — see the 403 on `POST /api/v1/issue-wealth-request`.
      security: [{ orgApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ConsentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeConsentBody" }
            examples:
              english:
                value: { revocation_reason: "the customer withdrew consent at the branch counter" }
              french:
                summary: Non-ASCII free text is the target market, not an edge case
                value: { revocation_reason: "le client a retiré son consentement lors du rendez-vous en agence" }
              arabic:
                value: { revocation_reason: "سحب العميل موافقته أثناء زيارته لمكتب البنك" }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentResponse" }
        "400":
          description: revocation_reason shorter than 10 characters.
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            Already revoked. The message names when, and (if given) why, so a
            caller can tell "someone else already handled this" from "my own
            retry landed twice".
          $ref: "#/components/responses/Error"

  /vault:
    get:
      tags: [Vault]
      summary: Download the encrypted vault blob
      responses:
        "200":
          description: |
            Ciphertext and version. The server cannot decrypt this — the key is
            derived on the holder's device and never transmitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultBlob" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Vault]
      summary: Upload the encrypted vault blob
      description: |
        Compare-and-swap on `expected_version` — a stale version is rejected
        rather than silently overwriting a concurrent write from another device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext, vault_root, expected_version]
              properties:
                ciphertext: { type: string, description: base64url-no-pad AES-256-GCM ciphertext }
                vault_root: { type: string, description: base64url-no-pad Poseidon commitment }
                expected_version: { type: integer, format: int64 }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: Version conflict — re-read and retry.
          $ref: "#/components/responses/Error"
    delete:
      tags: [Vault]
      summary: Delete the stored vault blob
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }

  /vault/root:
    get:
      tags: [Vault]
      summary: The vault's current Merkle root and version
      responses:
        "200":
          description: Root commitment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vault_root: { type: string }
                  version: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/passkey/register/start:
    post:
      tags: [Auth]
      summary: Begin WebAuthn registration
      security: []
      responses:
        "200": { description: A WebAuthn `PublicKeyCredentialCreationOptions` challenge. }

  /auth/passkey/register/finish:
    post:
      tags: [Auth]
      summary: Complete WebAuthn registration
      security: []
      responses:
        "200": { description: A session token. }

  /auth/passkey/login/start:
    post:
      tags: [Auth]
      summary: Begin WebAuthn authentication
      security: []
      responses:
        "200": { description: A WebAuthn `PublicKeyCredentialRequestOptions` challenge. }

  /auth/passkey/login/finish:
    post:
      tags: [Auth]
      summary: Complete WebAuthn authentication
      security: []
      responses:
        "200": { description: A session token. }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Send an OTP over SMS or WhatsApp
      description: Fallback and recovery path; also the practical route for low-digital-literacy journeys.
      security: []
      responses:
        "202": { description: Dispatched. }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Exchange an OTP for a session token
      security: []
      responses:
        "200": { description: A session token. }
        "401": { $ref: "#/components/responses/Error" }

  /auth/uae-pass/start:
    get:
      tags: [Auth]
      summary: Begin UAE Pass (OIDC) login
      description: |
        The flow, callback handling and account linking are real; the IdP call
        itself is a stub adapter until government sandbox credentials exist.
      security: []
      responses:
        "302": { description: Redirect to the UAE Pass authorize endpoint. }

  /auth/uae-pass/callback:
    get:
      tags: [Auth]
      summary: UAE Pass OIDC callback
      security: []
      responses:
        "200": { description: A session token. }

  /api/v1/products:
    post:
      tags: [Product registry]
      summary: Register a structured product and its suitability terms
      security:
        - orgApiKey: []
      description: |
        Scoped to the calling org. Two banks may register the same ISIN
        independently, on different terms, and neither can see the other's —
        the key is `(org_id, product_isin)`, not the bare ISIN, because a
        competitor's minimum-income threshold is a commercially sensitive fact.

        `approved_by_risk_committee` defaults to **false**, which is the only
        safe default for a flag whose purpose is to gate assessment.

        Re-registering an existing ISIN is a `409`, not a silent overwrite:
        rewriting the terms every in-flight assessment quotes is far more likely
        to be a mistake than an intent, and `PATCH` exists for the intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Malformed ISIN, empty name, or a term outside its bounds.
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Already registered for this organisation.
          $ref: "#/components/responses/Error"
    get:
      tags: [Product registry]
      summary: List this organisation's products
      security:
        - orgApiKey: []
      parameters:
        - name: approved_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            What an advisor-facing product picker should ask for, so an
            unapproved instrument never appears as recommendable.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/products/{isin}:
    parameters:
      - name: isin
        in: path
        required: true
        schema: { type: string, example: XS1234567890 }
    get:
      tags: [Product registry]
      summary: Read one product
      security:
        - orgApiKey: []
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: |
            Not in *this* organisation's registry. Another tenant's product is
            indistinguishable from one that does not exist.
          $ref: "#/components/responses/Error"
    patch:
      tags: [Product registry]
      summary: Amend terms or record risk-committee approval
      security:
        - orgApiKey: []
      description: |
        Every field is optional; only what is supplied changes. The audit event
        records the before and after of each changed field, because "who lowered
        the minimum income, and when" is the first question anyone reviewing a
        mis-sold product asks.

        An amendment applies to assessments opened **after** it. Assessments
        already open keep the terms they were opened with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendProduct"
      responses:
        "200":
          description: The amended product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: A term outside its bounds.
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/wealth-assessments/{request_id}:
    get:
      tags: [Structured-product suitability]
      summary: The evidence pack for one assessment
      security:
        - orgApiKey: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Everything needed to reconstruct one suitability assessment, in one
        call: the terms and where they came from, every proof attempt (accepted
        *and* rejected), the verification key digest, the audit-chain excerpt,
        and the verdict with a note on how it was read.

        This is an API rather than a report generator on purpose. A bank's
        compliance function will want the evidence in their own template, in
        Arabic, joined to their own CRM; if the only route to it were a script
        written against our schema, they would be blocked on us for every one of
        those. `scripts/export_audit_evidence.py` is simply the consumer that
        renders a PDF.

        What is deliberately absent: the client's income, liquid assets, risk
        tolerance and holdings. The server never had them, and the response says
        so explicitly rather than leaving a reader to wonder whether the gap is
        an oversight.
      responses:
        "200":
          description: The evidence pack.
          content:
            application/json:
              schema:
                type: object
        "404":
          description: No such assessment for this organisation.
          $ref: "#/components/responses/Error"

  /api/v1/wealth-assessments/{request_id}/decision-evidence:
    get:
      tags: [Structured-product suitability, Audit trail]
      summary: The sealed DecisionEvidence record for one assessment
      security:
        - orgApiKey: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        A second route rather than a reshaping of the one above on purpose:
        that one is the operational view a bank's own tooling already
        consumes; this is the sealed shape pinned to a versioned JSON Schema
        (`schema/decision_evidence/v1.3.0.json`) that becomes immutable the
        moment a record is sealed under it. Collapsing the two would make
        every convenience change to the operational view a breaking change
        to a schema that cannot break.

        `binding_integrity` is computed fresh on every read, not only when
        someone thinks to ask — a database `UPDATE` against
        `decision_model_attestations` or `consent_grants` changes what this
        record serves while leaving the hash chain byte-identical, and a
        control nobody invokes by default is not a control. It covers this
        decision's own binding events, every model correction filed against
        it, and the consent grant it cites, if any.
      responses:
        "200":
          description: The sealed record, its digest, and its binding-integrity verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionEvidenceResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: No such assessment for this organisation.
          $ref: "#/components/responses/Error"

  /api/v1/wealth-assessments/{request_id}/review:
    post:
      tags: [Structured-product suitability]
      summary: Record a human review of one decision (org)
      security:
        - orgApiKey: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        The control the "bypass human review" attack had nothing to bypass
        until this landed. `override: false` (the default) is checked, not
        trusted: an `action` that contradicts the circuit's verdict with
        `override: false` is refused, so a reviewer cannot quietly override
        by leaving the flag alone. Writing a review updates the sealed
        record's `human_review`/`decision_basis` and is itself bound to the
        chain, so it is returned as the full `DecisionEvidenceResponse`
        rather than a bare acknowledgement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewBody" }
      responses:
        "201":
          description: Review recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionEvidenceResponse" }
        "400":
          description: |
            Empty `reviewer_id`/`reviewer_role`; `action` not one of
            `approved`/`rejected`/`modified`; both `review_duration_ms` and
            `review_started_at` supplied; a negative duration; `override:
            false` with an action that contradicts the circuit's verdict; or
            `reviewed_at`/`review_started_at` outside the clock-skew
            allowance.
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: No such assessment for this organisation.
          $ref: "#/components/responses/Error"
        "409":
          description: This decision already has a review on file.
          $ref: "#/components/responses/Error"

  /api/v1/wealth-assessments/{request_id}/model-corrections:
    post:
      tags: [Structured-product suitability]
      summary: File a correction to a decision's model attestation (org)
      security:
        - orgApiKey: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        A collection, and plural in the path, on purpose: the attestation is
        written before the decision exists, and a firm may have to contradict
        it more than once — a first correction naming a replacement model, a
        later one admitting the replacement cannot be stood behind either.
        Not a `PATCH` on the assessment: this is a statement a named party
        made at a named time, and the original attestation row is never
        altered. Each correction is bound to the chain independently
        (`decision_model_attestation_correction_bound`), so a later `DELETE`
        against the correction row is detectable as `source_row_missing`
        rather than silently reverting the record to the original
        declaration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCorrectionBody" }
      responses:
        "201":
          description: Correction recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCorrectionResponse" }
        "400":
          description: |
            Empty `asserted_by`/`asserted_by_role`/`correction_reason`; a
            malformed `corrected_model` block (same rules as
            `ai_participation` on `POST /api/v1/issue-wealth-request`); or
            `asserted_at` outside the clock-skew allowance.
          $ref: "#/components/responses/Error"
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: No such assessment for this organisation.
          $ref: "#/components/responses/Error"
        "409":
          description: Nothing to correct (no attestation exists to contradict).
          $ref: "#/components/responses/Error"

  /health:
    get:
      tags: [Operations]
      summary: Deep readiness check
      security: []
      description: |
        Distinct from `/healthz`, which is the liveness probe and must not
        depend on anything external — restarting a container because its
        database blinked makes an outage worse.

        This one answers the questions that decide whether the instance can
        complete a suitability journey: is the database reachable, is the
        signing `kid` actually present in the JWKS a relying party would fetch,
        is there a verification key for every circuit, and — the one nothing
        else would catch — does the wealth verification key in use still match
        the one published in the repository. Both keys work perfectly well in
        isolation; if they have drifted, every proof accepted today is
        unverifiable tomorrow by the examiner holding the committed key, with no
        other symptom.

        Returns `503` when degraded, so a load balancer can drain the instance
        without killing it.
      responses:
        "200":
          description: Healthy.
        "503":
          description: Degraded. The body names which check failed.

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus exposition
      security: []
      description: |
        `memtara_proof_verification_total{circuit_type,result}`,
        `memtara_proof_latency_seconds` (histogram, by circuit) and
        `memtara_product_registry_size`.

        Unauthenticated, because that is how scrapers work. The safety of that
        rests on carrying no tenant-identifying label: a per-org label would
        turn this endpoint into a customer directory, and reveal from a rising
        counter when a named competitor is onboarding. Per-tenant volume is
        answerable from the audit log, behind `OrgAuth`, which is where a
        per-tenant fact belongs.
      responses:
        "200":
          description: Exposition text.
          content:
            text/plain:
              schema: { type: string }

  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema: { type: string, example: ok }

components:

  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        An opaque, revocable session token from any auth flow. Opaque rather
        than a JWT precisely so it can be killed in one query — the product's
        revocation guarantees depend on it.
    orgApiKey:
      type: http
      scheme: bearer
      description: |
        A relying party's API key, presented in the same `Authorization: Bearer`
        header as a session token. Routes readable by "the org that created it
        or the user it is for" try the presented credential as both.

  parameters:
    DisclosureRequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrgId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  schemas:

    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, alg, kid]
            properties:
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              x:
                type: string
                description: base64url-no-pad, 32-byte Ed25519 public key (RFC 8037 §2).
              use: { type: string, const: sig }
              alg: { type: string, const: EdDSA }
              kid:
                type: string
                description: RFC 7638 JWK thumbprint. Stable for a given key.

    PredicateCatalogueEntry:
      type: object
      properties:
        predicate: { type: string }
        circuit: { $ref: "#/components/schemas/CircuitType" }
        cbuae_clauses:
          type: array
          items: { type: string }
          description: Clause ids from CBUAE_EN_6958_VER1, e.g. "5(c)".
        dfsa_rules:
          type: array
          items: { type: string }
          description: |
            DFSA Conduct of Business rules this predicate is evidence for. See
            the DFSA appendix in `docs/REGULATORY_MATRIX.md` for the caveat on
            this identifier — suitability is COB 3.4 in the current rulebook,
            not 3.1.
        endpoint:
          type: string
          description: |
            Which route mints a token for this predicate. Everything except
            suitability goes through `/api/v1/issue-proof`; that endpoint
            refuses any predicate whose circuit has a public output it does not
            read.
        description: { type: string }

    IssueProofRequest:
      type: object
      required: [user_id, predicate]
      properties:
        user_id: { type: string, format: uuid }
        predicate:
          type: string
          description: Must be one of `GET /api/v1/predicates`.
        disclosure_request_id:
          type: string
          format: uuid
          description: Required on the fresh path; optional on the attested path, where it narrows which prior proof to re-attest.
        public_inputs:
          type: array
          items: { type: string, pattern: "^0[xX][0-9a-fA-F]{1,64}$" }
          description: One `0x`-prefixed hex field element per public input, in the circuit's declared order. Supply with `proof` or omit both.
        proof:
          type: string
          description: base64url-no-pad `bb` proof bytes.

    IssueProofResponse:
      type: object
      required: [proof_token, expires_in, regulatory_audit_id]
      properties:
        proof_token:
          type: string
          description: Compact JWS (EdDSA). Claims are described by `ProofTokenClaims`.
        expires_in:
          type: integer
          description: Seconds. 300 by default.
          example: 300
        regulatory_audit_id:
          type: string
          format: uuid
          description: Echoed from the token so a caller can log it without decoding the JWT.

    ProofTokenClaims:
      type: object
      description: |
        The decoded payload of `proof_token`. Not a response body — documented
        here because it is the actual integration contract a relying party
        codes against.
      required: [iss, sub, user_id, predicate, verified, circuit, proof_hash, regulatory_audit_id, cbuae_clauses, iat, exp, jti]
      properties:
        iss: { type: string, description: The issuer's base URL. Validate it. }
        sub: { type: string, format: uuid, description: Same value as user_id, for generic JOSE tooling. }
        user_id: { type: string, format: uuid }
        predicate: { type: string }
        verified:
          type: boolean
          const: true
          description: |
            Always true on an issued token — a failed verification produces an
            error, not a negative attestation. Assert on it anyway and fail
            closed if a future version ever changes that.
        circuit: { $ref: "#/components/schemas/CircuitType" }
        proof_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the verified proof bytes, lowercase hex. Binds this attestation to one specific proof.
        regulatory_audit_id:
          type: string
          format: uuid
          description: |
            The join key between this token, Memtara's `audit_log` hash chain,
            and the relying party's own chain — what makes two independent
            append-only logs correlatable without either system calling the
            other.
        cbuae_clauses:
          type: array
          items: { type: string }
        product_isin:
          type: string
          description: |
            Suitability attestations only. The instrument the assessment was
            performed for. A verdict detached from its instrument is
            meaningless — the same client is suitable for one note and not
            another — so a relying party must check this against the product it
            is about to recommend.
        suitable:
          type: boolean
          description: |
            Suitability attestations only, and **not** `verified` under another
            name. `verified` says a proof was cryptographically checked;
            `suitable` is the answer that proof carried, and it is legitimately
            `false`. A documented decline is evidence of an assessment; gating
            on `verified` alone gates on nothing.
        dfsa_rules:
          type: array
          items: { type: string }
        iat: { type: integer, format: int64 }
        exp: { type: integer, format: int64 }
        jti:
          type: string
          format: uuid
          description: Lets a relying party reject a replayed token inside its validity window.

    Product:
      type: object
      required: [id, org_id, product_isin, product_name, risk_level, min_income,
                 min_liquidity, max_concentration_percent, approved_by_risk_committee,
                 check_digit_valid, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        product_isin: { type: string, example: XS1234567890 }
        product_name: { type: string }
        risk_level: { type: integer, minimum: 1, maximum: 5 }
        min_income: { type: integer, format: int64 }
        min_liquidity: { type: integer, format: int64 }
        max_concentration_percent: { type: integer, minimum: 0, maximum: 100 }
        approved_by_risk_committee:
          type: boolean
          description: |
            Not a label. `issue-wealth-request` returns 409 while this is false.
        check_digit_valid:
          type: boolean
          description: |
            The ISO 6166 check digit result, reported rather than enforced. The
            illustrative identifiers used throughout this project fail it, so
            enforcing would reject the cases the feature was specified against.
            A deployment fed by a real product master should treat `false` here
            as a data-quality alarm.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProduct:
      type: object
      required: [product_isin, product_name, risk_level, min_income, min_liquidity,
                 max_concentration_percent]
      properties:
        product_isin: { type: string }
        product_name: { type: string }
        risk_level: { type: integer, minimum: 1, maximum: 5 }
        min_income: { type: integer, format: int64, minimum: 0 }
        min_liquidity: { type: integer, format: int64, minimum: 0 }
        max_concentration_percent: { type: integer, minimum: 0, maximum: 100 }
        approved_by_risk_committee: { type: boolean, default: false }

    AmendProduct:
      type: object
      description: Every field optional; only what is supplied changes.
      properties:
        product_name: { type: string }
        risk_level: { type: integer, minimum: 1, maximum: 5 }
        min_income: { type: integer, format: int64, minimum: 0 }
        min_liquidity: { type: integer, format: int64, minimum: 0 }
        max_concentration_percent: { type: integer, minimum: 0, maximum: 100 }
        approved_by_risk_committee: { type: boolean }

    IssueWealthRequest:
      type: object
      required: [user_id, product_isin]
      properties:
        user_id: { type: string, format: uuid }
        product_isin:
          type: string
          pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
          example: XS1234567890
          description: |
            Must already be registered for this org via `POST /api/v1/products`,
            and approved by the risk committee. The terms come from that entry.
        min_income:
          type: integer
          deprecated: true
          description: |
            **Rejected, not ignored.** Supplying any of the four term fields is
            a `400`. They moved to the product registry; an integration that
            still sends them believes it is setting the bar, and silently
            ignoring that belief is how an advisor ends up with a signed
            attestation against thresholds nobody set.
        min_liquidity: { type: integer, deprecated: true }
        max_concentration_percent: { type: integer, deprecated: true }
        product_risk_level: { type: integer, deprecated: true }
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
          description: How long the client has to answer. Long enough to approve a prompt on a phone, short enough that a stale assessment cannot be presented as a current one.

    IssueWealthRequestResponse:
      type: object
      required: [request_id, circuit, nonce, product_ref, product_isin, product_name, product_id, window_start, window_end, expires_in, public_input_template]
      properties:
        request_id: { type: string, format: uuid }
        circuit: { $ref: "#/components/schemas/CircuitType" }
        product_name:
          type: string
          description: |
            From the registry, snapshotted onto this request so a product
            renamed later does not retroactively rename it in the evidence.
        product_id:
          type: string
          format: uuid
          description: The catalogue row the terms came from.
        nonce:
          type: string
          description: base64url-no-pad. The exact bytes the client must supply as the `nonce` public input and bind into the signed commitment.
        product_ref:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: Domain-separated digest of the ISIN, returned so the client need not reimplement the derivation and risk disagreeing with the server about it.
        product_isin: { type: string }
        min_income: { type: integer, format: int64 }
        min_liquidity: { type: integer, format: int64 }
        max_concentration_percent: { type: integer }
        product_risk_level: { type: integer }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        expires_in: { type: integer }
        public_input_template:
          type: array
          description: |
            The 12 public inputs in circuit order, with every server-fixed value
            filled in and the client-supplied ones named. Returned because the
            ordering is a protocol detail a client has no other way to learn,
            and getting it wrong produces a proof that fails verification with
            no clue as to why. Index 11 is the circuit's output.
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
              note: { type: string }

    SubmitWealthProofRequest:
      type: object
      required: [request_id, public_inputs, proof]
      properties:
        request_id: { type: string, format: uuid }
        public_inputs:
          type: array
          minItems: 12
          maxItems: 12
          items: { type: string, pattern: "^0[xX][0-9a-fA-F]{1,64}$" }
        proof:
          type: string
          description: base64url-no-pad `bb` proof bytes (14,656 bytes for this circuit).

    SubmitWealthProofResponse:
      type: object
      required: [proof_token, expires_in, suitable, product_isin, regulatory_audit_id]
      properties:
        proof_token:
          type: string
          description: Compact JWS (EdDSA), carrying `suitable`, `product_isin` and `dfsa_rules` in addition to the usual claims.
        expires_in: { type: integer, example: 300 }
        suitable:
          type: boolean
          description: |
            The circuit's verdict, echoed outside the token so a caller can act
            on it without decoding the JWT. The authoritative copy is the
            signed `suitable` claim inside the token; this one is convenience,
            not evidence.
        product_isin: { type: string }
        regulatory_audit_id: { type: string, format: uuid }

    CreateDisclosureRequest:
      type: object
      required: [user_id, circuit_type, policy, ttl_seconds]
      properties:
        user_id: { type: string, format: uuid }
        circuit_type: { $ref: "#/components/schemas/CircuitType" }
        policy:
          type: object
          description: A serialized `SessionPolicy` — the same type `vault/` and the circuits already agree on.
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 604800

    DisclosureRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        circuit_type: { $ref: "#/components/schemas/CircuitType" }
        policy: { type: object }
        status: { $ref: "#/components/schemas/DisclosureStatus" }
        nonce:
          type: string
          description: base64url-no-pad, 32 bytes. The exact value the proof must commit to.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    DisclosureRequestSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        circuit_type: { $ref: "#/components/schemas/CircuitType" }
        status: { $ref: "#/components/schemas/DisclosureStatus" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    SubmitProofRequest:
      type: object
      required: [public_inputs, proof]
      properties:
        public_inputs:
          type: array
          items: { type: string, pattern: "^0[xX][0-9a-fA-F]{1,64}$" }
        proof: { type: string }

    SubmitProofResponse:
      type: object
      properties:
        proof_id: { type: string, format: uuid }
        valid: { type: boolean }
        request_status: { $ref: "#/components/schemas/DisclosureStatus" }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type:
          type: string
          examples: [disclosure_request_created, proof_verified, proof_verification_failed, proof_token_issued]
        ref_id: { type: string, format: uuid, nullable: true }
        event_hash: { type: string, description: base64url-no-pad SHA-256. }
        prev_hash: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    VaultBlob:
      type: object
      properties:
        ciphertext: { type: string }
        vault_root: { type: string }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    CircuitType:
      type: string
      enum: [emergency_session, ai_session, tax_session, identity_session, wealth_suitability]

    DisclosureStatus:
      type: string
      enum: [pending, fulfilled, expired, revoked]

    OrgType:
      type: string
      enum: [bank, ai_platform, hospital, government]

    # -------------------------------------------------------------------
    # Consent
    # -------------------------------------------------------------------

    CreateConsentBody:
      type: object
      required: [user_id, scope, consent_version, granted_via]
      properties:
        user_id: { type: string, format: uuid }
        scope:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: |
            Purpose/category strings, e.g.
            `wealth.suitability_recommendation`. Must not be empty — an empty
            array authorises nothing, and reads as a gap rather than the
            deliberate absence it would actually be. Every element must be a
            non-blank string; a float here is refused (400), never silently
            coerced or stored, because it will be hashed into the chain and a
            float has no canonical rendering Python and Rust agree on.
          example: ["wealth.suitability_recommendation"]
        consent_version:
          type: string
          minLength: 1
          description: The consent policy version this grant was made under — the text the customer actually saw.
        purpose_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The domain-separated digest of the purpose this grant covers, if
            the capturing system computed one. Optional — the one field on
            this record that is.
        granted_at:
          type: string
          format: date-time
          description: |
            Defaults to the server's clock. A grant migrated from a legacy
            CRM or a paper file may legitimately be years in the past — there
            is no lower bound, only an upper one (grants cannot be claimed to
            have happened in the future by more than the clock-skew
            allowance).
        granted_via:
          type: string
          minLength: 1
          description: Which channel captured the grant, e.g. `assisted_kiosk`, `mobile_app`. Free text, not a fixed enum.
          example: assisted_kiosk

    ConsentResponse:
      type: object
      required: [id, org_id, user_id, scope, consent_version, granted_at, granted_via, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        scope:
          type: array
          items: { type: string }
        consent_version: { type: string }
        purpose_hash:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
        granted_at: { type: string, format: date-time }
        granted_via: { type: string }
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revocation_reason:
          type: string
          nullable: true
          description: Always present alongside a non-null `revoked_at`, always null otherwise — never one without the other.
        created_at: { type: string, format: date-time }

    RevokeConsentBody:
      type: object
      required: [revocation_reason]
      properties:
        revocation_reason:
          type: string
          minLength: 10
          description: |
            What an examiner reads beside the grant it withdraws — say why:
            the customer asked, a relationship ended, a regulator ordered it.
            Free text; French and Arabic values are exercised end to end by
            `tests/break_it/test_attack_08_consent_revocation.py`, not only
            English.
          example: le client a retiré son consentement lors du rendez-vous en agence

    # -------------------------------------------------------------------
    # Audit trail — checkpoints and the external witness
    # -------------------------------------------------------------------

    AnchorState:
      description: |
        The three cases a checkpoint's external-witness state can be in,
        distinguished because "not yet, and that is expected" and "not yet,
        and that is a problem" are different words for a reason. See
        `backend/api/src/audit/anchor.rs::classify`.
      oneOf:
        - type: object
          required: [status, target, reference, anchored_at]
          properties:
            status: { type: string, const: anchored }
            target:
              type: string
              description: Which kind of witness — `rfc3161` for the production provider, `rfc3161-dev-mock` for the dev-only fabricated one.
              example: rfc3161
            reference:
              type: string
              description: A short, human-checkable locator — `sha256:<hex>` of the receipt bytes for this provider.
            anchored_at: { type: string, format: date-time }
          title: Anchored
        - type: object
          required: [status, age_seconds]
          properties:
            status: { type: string, const: pending }
            age_seconds:
              type: integer
              description: How long this checkpoint has gone unanchored. Not itself a finding — still inside the sweep's own cadence.
          title: Pending
        - type: object
          required: [status, age_seconds, note]
          properties:
            status: { type: string, const: overdue }
            age_seconds: { type: integer }
            note:
              type: string
              description: |
                Plain English, IS a finding: this checkpoint has gone longer
                than the sweep interval plus clock-skew allowance without
                being anchored. Ask whether the anchoring job is running and
                whether the TSA is reachable; `POST /audit/anchors/sweep`
                runs it on demand.
          title: Overdue

    ExternalAnchor:
      description: |
        `AnchorState`'s fields, always present at this level (`status` plus
        whichever fields that status carries), plus the raw witness bytes
        when — and only when — `status` is `anchored`.
      allOf:
        - $ref: "#/components/schemas/AnchorState"
        - type: object
          properties:
            receipt_der_base64:
              type: string
              description: |
                base64 (standard) of the raw RFC 3161 `TimeStampToken` DER
                bytes. Present only when `status` is `anchored` — an offline
                verifier needs these to check the witness cryptographically
                without this deployment's cooperation
                (`scripts/bundle/verify_bundle.py` step 7c).

    CheckpointResponse:
      type: object
      required: [checkpoint_no, head_seq, head_event_hash, covered_row_count,
                 checkpoint_hash, kid, signed_at, chain, jws, typ, jwks_url, external_anchor]
      properties:
        checkpoint_no:
          type: integer
          format: int64
          description: Monotonic counter, inside the signature. Anti-replay.
        head_seq:
          type: integer
          format: int64
          description: audit_log.seq of the row this checkpoint pins.
        head_event_hash:
          type: string
          description: base64url-no-pad of that row's 32-byte event_hash.
        covered_row_count:
          type: integer
          format: int64
          description: Rows in audit_log with seq <= head_seq at signing time. Anti-truncation.
        prev_checkpoint_hash:
          type: string
          nullable: true
          description: base64url-no-pad SHA-256 of the previous checkpoint's compact JWS. null for the first.
        checkpoint_hash:
          type: string
          description: SHA-256 over the compact JWS bytes — what the NEXT checkpoint links to.
        kid: { type: string }
        signed_at: { type: string, format: date-time }
        chain:
          type: string
          const: memtara.audit_log.global.v1
        jws:
          type: string
          description: Compact JWS (EdDSA). The evidence — everything else in this object is an index over what this says.
        typ:
          type: string
          const: memtara-audit-checkpoint+jwt
        jwks_url:
          type: string
          description: Where to fetch the key that verifies `jws`, so the checkpoint is self-describing when it is pasted into a ticket six months from now.
        external_anchor: { $ref: "#/components/schemas/ExternalAnchor" }

    CoveringResponse:
      type: object
      required: [seq, covered, note]
      properties:
        seq: { type: integer, format: int64 }
        covered:
          type: boolean
          description: False means this row is in the residual exposure window — newer than every checkpoint.
        checkpoint:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CheckpointResponse" }]
        note:
          type: string
          description: Plain English restatement of `covered`, because the person asking is usually asking "is this specific decision protected?".

    CheckpointFailure:
      type: object
      required: [failure]
      description: |
        One way a checkpoint and the database can disagree. Which of the six
        it is determines whether an edit, a deletion or a forged signature is
        being looked at — three different incidents.
      properties:
        failure:
          type: string
          enum:
            - signature_invalid
            - columns_disagree_with_signed_payload
            - head_row_missing
            - head_hash_mismatch
            - row_count_mismatch
            - checkpoint_chain_broken
      additionalProperties: true

    CheckpointVerification:
      type: object
      required: [checkpoint_no, head_seq, intact, failures]
      properties:
        checkpoint_no: { type: integer, format: int64 }
        head_seq: { type: integer, format: int64 }
        intact:
          type: boolean
          description: True only when failures is empty.
        failures:
          type: array
          items: { $ref: "#/components/schemas/CheckpointFailure" }

    IntegrityResponse:
      type: object
      required: [intact, uncovered_rows, note]
      properties:
        intact:
          type: boolean
          description: True only if a checkpoint exists AND it verifies against the log. Deliberately false, not absent, when none exists.
        checkpoint:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CheckpointVerification" }]
        uncovered_rows:
          type: integer
          format: int64
          description: Rows appended since the checkpoint — the exposure, as a number.
        note: { type: string }
        anchor:
          nullable: true
          description: null only when there is no checkpoint at all yet.
          allOf: [{ $ref: "#/components/schemas/AnchorState" }]

    EmitResponse:
      type: object
      required: [emitted, note]
      properties:
        emitted:
          type: boolean
          description: False when the head had not moved and the existing checkpoint was returned unchanged.
        checkpoint:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CheckpointResponse" }]
        note: { type: string }

    SweepResponse:
      type: object
      required: [attempted, anchored, failed, details, note]
      properties:
        attempted: { type: integer, format: int64 }
        anchored: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        details:
          type: array
          items:
            type: object
            required: [checkpoint_no, result]
            properties:
              checkpoint_no: { type: integer, format: int64 }
              result:
                type: string
                enum: [anchored, failed]
              target: { type: string, description: Only present when result is anchored. }
              reference: { type: string, description: Only present when result is anchored. }
              error: { type: string, description: Only present when result is failed. }
        note: { type: string }

    # -------------------------------------------------------------------
    # Binding replay — the third claim, and the only one that survives an
    # UPDATE against the firm's own database. See audit/binding.rs and
    # audit/replay.rs.
    # -------------------------------------------------------------------

    ReplayVerdict:
      type: string
      enum: [INTACT, ALTERED, INCOMPLETE]
      description: |
        Never a boolean, and INCOMPLETE is the one that matters commercially:
        an org whose decisions all predate binding events has nothing to
        replay, and reporting that as INTACT would hand it a clean bill of
        health for a property it does not have. An absent check is not a
        passed one.

    ReplayResult:
      type: string
      enum: [intact, altered, source_row_missing, unverifiable]
      description: |
        Four outcomes on one event, not two. A deleted source row
        (`source_row_missing`) and an edited one (`altered`) are different
        incidents with different responses; `unverifiable` means the payload
        could not be rebuilt at all — a bug in the verifier until proven
        otherwise, not an accusation about the row.

    ReplayedEvent:
      type: object
      required: [seq, event_type, created_at, result, recorded_event_hash, detail]
      properties:
        seq: { type: integer, format: int64 }
        event_type: { type: string }
        ref_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/ReplayResult" }
        recorded_event_hash:
          type: string
          description: The hash as stored.
        recomputed_event_hash:
          type: string
          nullable: true
          description: The hash the current rows produce. null when there was nothing to rebuild.
        prev_hash:
          type: string
          nullable: true
          description: The predecessor hash this event was written against, as stored — an input to the hash.
        rebuilt_payload:
          type: object
          nullable: true
          description: |
            The rebuilt payload itself, as it stands now — the difference
            between a verifier and a claim. If it disagrees with the recorded
            digest, that disagreement is the finding, not hidden.
        detail:
          type: string
          description: A sentence an examiner can put in a report without translating it.

    ReplaySummary:
      type: object
      required: [binding_events, intact, altered, source_row_missing, unverifiable, out_of_scope]
      properties:
        binding_events: { type: integer, format: int64 }
        intact: { type: integer, format: int64 }
        altered: { type: integer, format: int64 }
        source_row_missing: { type: integer, format: int64 }
        unverifiable: { type: integer, format: int64 }
        out_of_scope:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Event types this org's trail carries that carry no binding, and therefore were not checked — by type and count, never silently excluded.

    ReplayReport:
      type: object
      required: [org_id, checked_at, verdict, summary, events, checks, does_not_check]
      properties:
        org_id: { type: string, format: uuid }
        checked_at: { type: string, format: date-time }
        verdict: { $ref: "#/components/schemas/ReplayVerdict" }
        summary: { $ref: "#/components/schemas/ReplaySummary" }
        events:
          type: array
          items: { $ref: "#/components/schemas/ReplayedEvent" }
        checks:
          type: array
          items: { type: string }
          description: What this report checks, stated in the payload rather than only in a doc nobody reads at 2am.
        does_not_check:
          type: array
          items: { type: string }
          description: Chain linkage and the chain head are explicitly named here — this report is silent about both.

    # -------------------------------------------------------------------
    # Sealed decision evidence
    # -------------------------------------------------------------------

    DecisionEvidenceResponse:
      type: object
      required: [decision_evidence, canonical_evidence_sha256, evidence_schema]
      properties:
        decision_evidence:
          type: object
          description: |
            The sealed record, validated against
            `schema/decision_evidence/v1.3.0.json`. Includes
            `decision_basis` (enum, now `proof_only` /
            `proof_and_human_concurred` / `proof_and_human_override` — the
            second was renamed from `proof_and_human_approved` in the 1.3.0
            bump, because "approved" claimed a judgement the basis alone does
            not evidence) and `data.consent` (`consent_id`, `consent_version`,
            `scope`, `granted_at`, `purpose_hash`, each a `Provenanced<T>`:
            `{state: "recorded", value}` when sourced from a real grant, or
            `{state: "unpopulated", unpopulated_reason, value: null}` when the
            grant has since been deleted — the decision's evidence still
            stands even though its consent block degrades). Full shape left
            to the pinned schema file rather than restated here, so this
            document cannot itself drift from the one that is actually
            immutable.
        canonical_evidence_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 over the canonical bytes — the same value a seal's canonical_evidence_sha256 carries.
        evidence_schema:
          type: string
          example: schema/decision_evidence/v1.3.0.json
        binding_integrity:
          description: |
            Whether the mutable rows this record was built from still say
            what the hash chain committed to — this decision's own binding
            events, every model correction filed against it, and the consent
            grant it cites, if any. Always present on a served read.
          allOf: [{ $ref: "#/components/schemas/ReplayReport" }]

    ReviewBody:
      type: object
      required: [reviewer_id, reviewer_role, action, human_review_protocol_version]
      properties:
        reviewer_id:
          type: string
          description: The firm's own identifier for the reviewer. Text, not a foreign key — Memtara has no directory of a bank's staff.
        reviewer_role: { type: string }
        action:
          type: string
          enum: [approved, rejected, modified]
        human_review_protocol_version: { type: string }
        override:
          type: boolean
          default: false
          description: |
            Whether the reviewer went against the control's verdict. Checked,
            not trusted: `action` contradicting the proof's verdict with
            `override: false` is refused, so a reviewer cannot quietly
            override by leaving the flag alone.
        override_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          description: When the human decided. Defaults to the server's clock, bounded by the same clock-skew allowance as `granted_at` on a consent grant.
        review_duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Supply this OR review_started_at, never both — they have different provenance and a record cannot carry two.
        review_started_at:
          type: string
          format: date-time
          description: The server subtracts its own receipt time from this, so at least the end of the interval is the server's, not the caller's.

    ModelCorrectionBody:
      type: object
      required: [asserted_by, asserted_by_role, correction_reason, corrected_model]
      properties:
        asserted_by:
          type: string
          description: The organisation's own identifier for whoever is asserting the correction. Text, not a foreign key.
        asserted_by_role: { type: string }
        correction_reason:
          type: string
          description: Why the correction is being made. Required, substantive, stored verbatim.
        corrected_model:
          type: object
          description: |
            What the organisation now says about AI participation, in the
            same wire shape `ai_participation` uses on
            `POST /api/v1/issue-wealth-request`. Untyped so a malformed block
            is refused with a message naming what is wrong rather than a
            bare 422 from axum's JSON rejection.
        asserted_at:
          type: string
          format: date-time
          description: When the organisation determined the correction. Defaults to the server's clock.

    ModelCorrectionResponse:
      type: object
      required: [correction_id, request_id, correction_no, corrected_declaration, asserted_at, recorded_at, decision_evidence]
      properties:
        correction_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        correction_no:
          type: integer
          description: Dense from 1, per decision — a missing number is legible as a removed correction to an examiner with no database access.
        corrected_declaration:
          type: string
          enum: [no_ai_participated, model_identified, participated_but_unidentified]
        asserted_at: { type: string, format: date-time }
        recorded_at:
          type: string
          format: date-time
          description: The server's own observation of when the correction arrived, beside the caller's claim about when it was determined.
        decision_evidence:
          type: string
          description: Where to read what the record now says, e.g. /api/v1/wealth-assessments/{id}/decision-evidence.
