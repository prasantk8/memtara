[package]
name = "memtara-api"
version = "0.1.0"
edition = "2021"
description = "Memtara backend: auth, encrypted vault sync, disclosure orchestration, proof verification"

[dependencies]
memtara-vault = { path = "../../vault" }

axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }

uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# In-memory cache for in-flight WebAuthn ceremony state (see auth/webauthn.rs).
dashmap = "6"

rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
base64 = "0.22"

# Ed25519 signing for the proof tokens AIHOOTS validates offline against
# /.well-known/jwks.json (crypto/signer.rs). Deliberately a raw signature
# crate rather than a JWT library: the EdDSA JWS serialization is ~20 lines
# and hand-writing it keeps the exact bytes we sign visible at the call
# site, which is the part a regulator's reviewer actually needs to check.
ed25519-dalek = "2"

# The audit checkpoint's external witness (audit/anchor.rs) is this
# codebase's first outbound HTTP call to a service it does not operate — an
# RFC 3161 timestamp authority. rustls, not the platform TLS stack, to match
# sqlx's `tls-rustls` feature above: one TLS backend compiled into this
# binary rather than two.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

anyhow = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
